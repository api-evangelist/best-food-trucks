description: Best Food Trucks (BFT) operates a food truck booking, scheduling, and mobile
  ordering platform that connects food truck vendors with property managers, office buildings,
  event organizers, and hungry customers. The platform lets locations schedule rotating
  food trucks, lets customers browse menus and place mobile orders ahead of time, and gives
  trucks a point-of-sale and payments surface for on-site service. Backed by Techstars, the
  company was surfaced as a portfolio-company lead and enriched into the API Evangelist network.
  This profile currently carries only public infrastructure and security artifacts; no public
  API, developer portal, or OpenAPI surface was discoverable during enrichment.
